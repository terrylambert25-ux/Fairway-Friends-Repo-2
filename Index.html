<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b5e20">
<title>Fairway Friends Golf v1.3</title>
<style>
* { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #f0f4f0; color: #1a2e1a; padding-bottom: 40px; }
header { background: #1b5e20; color: #fff; padding: 14px; text-align: center; }
nav { display: flex; background: #2e7d32; position: sticky; top: 0; z-index: 10; }
nav button { flex: 1; padding: 14px 4px; border: none; background: none; color: #c8e6c9; font-size: 15px; cursor: pointer; }
nav button.active { background: #1b5e20; color: #fff; font-weight: bold; }
.page { display: none; padding: 16px; max-width: 720px; margin: 0 auto; }
.page.active { display: block; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
h2 { margin-bottom: 12px; color: #1b5e20; font-size: 18px; }
label { display: block; font-size: 13px; color: #555; margin-top: 10px; }
input, select { padding: 12px; border: 1px solid #aaa; border-radius: 8px; font-size: 16px; margin: 4px 0; width: 100%; }
button.primary { background: #1b5e20; color: #fff; border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { border: 1px solid #ddd; padding: 8px 4px; text-align: center; }
th { background: #e8f5e9; font-size: 12px; }
.leaderboard-row { display: flex; justify-content: space-between; padding: 12px 8px; border-bottom: 1px solid #eee; font-size: 15px; align-items: center; }
.badge { background: #1b5e20; color: #fff; border-radius: 12px; padding: 4px 12px; font-weight: bold; }
.badge.good { background: #0277bd; }
.badge.bad { background: #c62828; }
#codeBar { background: #0d3311; color: #a5d6a7; padding: 6px; text-align: center; font-size: 13px; display: none; }
.syncDot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #999; margin-right: 6px; }
.syncDot.on { background: #4caf50; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 12px; }
.stepper button { width: 52px; height: 52px; font-size: 26px; border-radius: 12px; border: 2px solid #1b5e20; background: #fff; color: #1b5e20; font-weight: bold; }
.stepper input { width: 64px; text-align: center; font-size: 24px; font-weight: bold; padding: 6px; }
.holeNav { display: flex; justify-content: space-between; margin-top: 14px; }
.holeNav button { padding: 12px 18px; font-size: 15px; border-radius: 8px; border: none; background: #2e7d32; color: #fff; }
.holeNav button:disabled { background: #bbb; }
.vsPar { font-weight: bold; font-size: 16px; }
</style>
</head>
<body>
<header><h1>⛳ Fairway Friends <small style="font-size:12px;opacity:.7">v1.3</small></h1></header>
<div id="codeBar"><span class="syncDot" id="syncDot"></span>Round code: <b id="codeLabel"></b> <span id="playerCount"></span></div>
<nav>
<button class="active" onclick="show('rounds',this)">Rounds</button>
<button onclick="show('scorecard',this)">Play</button>
<button onclick="show('leaderboard',this)">Board</button>
<button onclick="show('courses',this)">Courses</button>
</nav>
<div id="rounds" class="page active">
<div class="card">
<h2>Start / Join Round</h2>
<label>Join code — share with friends, or leave blank to create one</label>
<input id="joinCode" placeholder="e.g. EAGLE4" style="text-transform:uppercase" autocomplete="off">
<label>Course</label><select id="courseSelect"></select>
<label>Game Type</label>
<select id="gameType">
<option value="stroke">Stroke Play</option>
<option value="stableford">Stableford</option>
<option value="skins">Skins</option>
</select>
<label>Players</label>
<div id="playerInputs">
<input class="playerName" placeholder="Player 1 name" autocomplete="off">
<input class="playerName" placeholder="Player 2 name" autocomplete="off">
</div>
<button class="primary" onclick="addPlayer()">+ Add Player</button>
<button class="primary" onclick="startRound()">Start Round</button>
</div>
</div>
<div id="scorecard" class="page">
<div class="card">
<h2 id="holeTitle">Hole 1</h2>
<div id="scorecardTable"></div>
<div class="holeNav">
<button id="prevBtn" onclick="changeHole(-1)">← Prev</button>
<button id="nextBtn" onclick="changeHole(1)">Next →</button>
</div>
</div>
</div>
<div id="leaderboard" class="page">
<div class="card"><h2 id="lbTitle">Leaderboard</h2><div id="lbBody"></div>
<button class="primary" onclick="copySummary()">📋 Copy Summary</button></div>
</div>
<div id="courses" class="page">
<div class="card"><h2>Course Library</h2><div id="courseList"></div></div>
<div class="card">
<h2>Add Custom Course</h2>
<label>Course name</label><input id="newCourseName" placeholder="Course name" autocomplete="off">
<label>Par per hole, comma separated (9 or 18 values)</label>
<input id="newCoursePars" placeholder="4,4,5,4,3,4,5,4,4,4,3,5,4,4,5,4,3,4">
<label>Slope (optional)</label><input id="newCourseSlope" placeholder="113" type="number">
<button class="primary" onclick="addCourse()">Save Course</button>
</div>
</div>
<script>
var DEFAULT_COURSES = [
{ name: "Pine Valley Muni", pars: [4,4,5,4,3,4,5,4,4,4,3,5,4,4,5,4,3,4], slope: 113 },
{ name: "Riverside Links", pars: [5,4,4,3,4,5,4,3,4,4,5,3,4,4,5,3,4,4], slope: 120 }
];
function loadJSON(key) {
  try { var v = JSON.parse(localStorage.getItem(key)); return (v && typeof v === 'object') ? v : null; } catch (e) { return null; }
}
var courses = loadJSON('ff_courses');
if (!Array.isArray(courses) || courses.length === 0) { courses = DEFAULT_COURSES; }
var badCourse = false;
for (var ci = 0; ci < courses.length; ci++) { if (!courses[ci].name || !Array.isArray(courses[ci].pars)) { badCourse = true; } }
if (badCourse) { courses = DEFAULT_COURSES; localStorage.removeItem('ff_courses'); }
var currentRound = loadJSON('ff_round');
if (currentRound && (!currentRound.course || !Array.isArray(currentRound.course.pars))) { currentRound = null; localStorage.removeItem('ff_round'); }
var currentHole = 0;
function saveLocal() {
  localStorage.setItem('ff_courses', JSON.stringify(courses));
  localStorage.setItem('ff_round', JSON.stringify(currentRound));
}
function show(id, btn) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) { pages[i].classList.remove('active'); }
  document.getElementById(id).classList.add('active');
  var btns = document.querySelectorAll('nav button');
  for (var j = 0; j < btns.length; j++) { btns[j].classList.remove('active'); }
  if (btn) btn.classList.add('active');
  if (id === 'scorecard') renderScorecard();
  if (id === 'leaderboard') renderLeaderboard();
  if (id === 'courses') renderCourses();
  if (id === 'rounds') renderCourseSelect();
}
function sumPars(c) { var t = 0; for (var i = 0; i < c.pars.length; i++) { t += c.pars[i]; } return t; }
function renderCourseSelect() {
  var html = '';
  for (var i = 0; i < courses.length; i++) {
    var c = courses[i];
    html = html + '<option value="' + i + '">' + c.name + ' (Par ' + sumPars(c) + ')</option>';
  }
  document.getElementById('courseSelect').innerHTML = html;
}
function addPlayer() {
  var inp = document.createElement('input');
  inp.className = 'playerName';
  inp.placeholder = 'Player ' + (document.querySelectorAll('.playerName').length + 1) + ' name';
  document.getElementById('playerInputs').appendChild(inp);
}
function startRound() {
  var inputs = document.querySelectorAll('.playerName');
  var names = [];
  for (var i = 0; i < inputs.length; i++) { if (inputs[i].value.trim()) names.push(inputs[i].value.trim()); }
  if (names.length < 1) { alert('Enter at least 1 player'); return; }
  var typed = document.getElementById('joinCode').value.trim().toUpperCase();
  var course = courses[document.getElementById('courseSelect').value];
  var players = [];
  for (var n = 0; n < names.length; n++) {
    var empty = [];
    for (var h = 0; h < course.pars.length; h++) { empty.push(''); }
    players.push({ name: names[n], scores: empty });
  }
  currentRound = { course: JSON.parse(JSON.stringify(course)), game: document.getElementById('gameType').value, date: new Date().toLocaleDateString(), players: players };
  currentHole = 0;
  saveLocal();
  if (window.setRoundCode) setRoundCode(typed || newCode());
  if (window.pushRound) pushRound();
  show('scorecard', document.querySelectorAll('nav button')[1]);
}
function newCode() {
  var words = ['EAGLE','BIRDIE','PAR','BOGEY','CHIP','DRIVE','PUTT','WEDGE'];
  return words[Math.floor(Math.random()*words.length)] + Math.floor(Math.random()*9+1);
}
function renderScorecard() {
  if (!currentRound) {
    document.getElementById('holeTitle').textContent = 'No active round';
    document.getElementById('scorecardTable').innerHTML = '<p>Start one on the Rounds tab.</p>';
    return;
  }
  var pars = currentRound.course.pars;
  var par = pars[currentHole];
  document.getElementById('holeTitle').textContent = 'Hole ' + (currentHole+1) + ' of ' + pars.length + ' - Par ' + par;
  var html = '<table><tr><th style="width:40%">Player</th><th>Score</th><th>vs Par</th></tr>';
  for (var pi = 0; pi < currentRound.players.length; pi++) {
    var p = currentRound.players[pi];
    var s = p.scores[currentHole];
    var label = '<span style="color:#999">-</span>';
    if (s !== '') {
      var diff = s - par;
      if (diff <= -2) { label = '<span class="vsPar" style="color:#0277bd">' + diff + ' bird!</span>'; }
      else if (diff === -1) { label = '<span class="vsPar" style="color:#0277bd">-1</span>'; }
      else if (diff === 0) { label = '<span class="vsPar">E</span>'; }
      else { label = '<span class="vsPar" style="color:#c62828">+' + diff + '</span>'; }
    }
    html = html + '<tr><td style="text-align:left;padding-left:8px">' + p.name + '</td><td><div class="stepper"><button onclick="stepScore(' + pi + ',-1)">-</button><input type="number" min="1" max="15" value="' + s + '" onchange="setScore(' + pi + ',this.value)"><button onclick="stepScore(' + pi + ',1)">+</button></div></td><td>' + label + '</td></tr>';
  }
  document.getElementById('scorecardTable').innerHTML = html + '</table>';
  document.getElementById('prevBtn').disabled = (currentHole === 0);
  document.getElementById('nextBtn').textContent = (currentHole >= pars.length - 1) ? 'Finish' : 'Next >';
}
function stepScore(pi, delta) {
  var cur = currentRound.players[pi].scores[currentHole];
  var val = (cur === '' ? 4 : cur) + delta;
  if (val < 1) val = 1; if (val > 15) val = 15;
  setScore(pi, val);
}
function setScore(pi, val) {
  currentRound.players[pi].scores[currentHole] = (val === '') ? '' : +val;
  saveLocal(); renderScorecard();
  if (window.pushRound) pushRound();
}
function changeHole(dir) {
  var max = currentRound.course.pars.length - 1;
  var next = currentHole + dir;
  if (next < 0) return;
  if (next > max) { show('leaderboard', document.querySelectorAll('nav button')[2]); return; }
  currentHole = next;
  renderScorecard();
}
function totalStroke(p) { var t = 0; for (var i = 0; i < p.scores.length; i++) { if (p.scores[i] !== '') t += p.scores[i]; } return t; }
function totalStableford(p) {
  var t = 0;
  for (var i = 0; i < p.scores.length; i++) {
    if (p.scores[i] === '') continue;
    var d = p.scores[i] - currentRound.course.pars[i];
    if (d <= -3) t += 5; else if (d === -2) t += 4; else if (d === -1) t += 3; else if (d === 0) t += 2; else if (d === 1) t += 1;
  }
  return t;
}
function through(p) { var t = 0; for (var i = 0; i < p.scores.length; i++) { if (p.scores[i] !== '') t++; } return t; }
function skinsFor(p) {
  var pi = -1;
  for (var x = 0; x < currentRound.players.length; x++) { if (currentRound.players[x] === p) pi = x; }
  var total = 0, carry = 0, pot = 2;
  for (var h = 0; h < currentRound.course.pars.length; h++) {
    var scores = [];
    for (var q = 0; q < currentRound.players.length; q++) { scores.push(currentRound.players[q].scores[h]); }
    var anyEmpty = false;
    for (var e = 0; e < scores.length; e++) { if (scores[e] === '') anyEmpty = true; }
    if (anyEmpty) continue;
    var best = Math.min.apply(null, scores);
    var winners = 0;
    for (var w = 0; w < scores.length; w++) { if (scores[w] === best) winners++; }
    if (winners === 1) {
      if (scores[pi] === best) total = total + pot + carry;
      carry = 0; pot = 2;
    } else { carry = carry + pot; }
  }
  return total;
}
function renderLeaderboard() {
  if (!currentRound) { document.getElementById('lbBody').innerHTML = '<p>No active round.</p>'; return; }
  var parTotal = sumPars(currentRound.course);
  var gameName = currentRound.game.charAt(0).toUpperCase() + currentRound.game.slice(1);
  document.getElementById('lbTitle').textContent = gameName + ' - ' + currentRound.course.name + ' (' + currentRound.date + ')';
  var rows = [];
  for (var i = 0; i < currentRound.players.length; i++) {
    var p = currentRound.players[i];
    var val;
    if (currentRound.game === 'stableford') { val = totalStableford(p); }
    else if (currentRound.game === 'skins') { val = skinsFor(p); }
    else { val = totalStroke(p) - parTotal; }
    rows.push({ name: p.name, thru: through(p), val: val });
  }
  rows.sort(function(a,b) {
    if (currentRound.game === 'stroke') { return a.val - b.val; }
    return b.val - a.val;
  });
  var html = '';
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r];
    var cls = '', disp;
    if (currentRound.game === 'stableford') { disp = row.val + ' pts'; }
    else if (currentRound.game === 'skins') { disp = '$' + row.val; }
    else {
      if (row.val > 0) { disp = '+' + row.val; cls = 'bad'; }
      else if (row.val === 0) { disp = 'E'; }
      else { disp = '' + row.val; cls = 'good'; }
    }
    html = html + '<div class="leaderboard-row"><span>' + (r+1) + '. <b>' + row.name + '</b> <small style="color:#777">(' + row.thru + ' thru)</small></span><span class="badge ' + cls + '">' + disp + '</span></div>';
  }
  document.getElementById('lbBody').innerHTML = html;
}
function copySummary() {
  var items = [];
  var rows = document.querySelectorAll('#lbBody .leaderboard-row');
  for (var i = 0; i < rows.length; i++) { items.push(rows[i].innerText.replace(/\n/g,' - ')); }
  navigator.clipboard.writeText('Golf: ' + document.getElementById('lbTitle').textContent + '\n' + items.join('\n'))
    .then(function() { alert('Leaderboard copied!'); });
}
function renderCourses() {
  var html = '';
  for (var i = 0; i < courses.length; i++) {
    var c = courses[i];
    html = html + '<div class="leaderboard-row"><span><b>' + c.name + '</b></span><span>' + c.pars.length + ' holes, Par ' + sumPars(c) + ', Slope ' + c.slope + '</span></div>';
  }
  document.getElementById('courseList').innerHTML = html;
}
function addCourse() {
  var name = document.getElementById('newCourseName').value.trim();
  var parStr = document.getElementById('newCoursePars').value.split(',');
  var pars = [];
  for (var i = 0; i < parStr.length; i++) { var n = +parStr[i].trim(); if (n > 0 && n <= 8) pars.push(n); }
  if (!name || pars.length < 9) { alert('Enter a name and at least 9 valid par values'); return; }
  var slope = +document.getElementById('newCourseSlope').value || 113;
  courses.push({ name: name, pars: pars, slope: slope });
  saveLocal(); renderCourses(); renderCourseSelect();
  document.getElementById('newCourseName').value = '';
  document.getElementById('newCoursePars').value = '';
  alert('Course saved!');
}
renderCourseSelect();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyDaD6_sJgbhiVctZefWE0x5h383NHvA1aQ",
authDomain: "fairway-friends-4c3d0.firebaseapp.com",
projectId: "fairway-friends-4c3d0",
storageBucket: "fairway-friends-4c3d0.firebasestorage.app",
messagingSenderId: "629803983175",
appId: "1:629803983175:web:eaeeb1306febff5b6a2c62"
};
let db = null, syncing = false, unsub = null, pushTimer = null;
try {
const app = initializeApp(firebaseConfig);
db = getFirestore(app);
signInAnonymously(getAuth(app)).catch(() => console.log('Offline — local mode'));
} catch (e) { console.log('Firebase not configured — local-only mode'); }
window.setRoundCode = function(code) {
localStorage.setItem('ff_code', code);
document.getElementById('codeBar').style.display = 'block';
document.getElementById('codeLabel').textContent = code;
listen();
};
window.pushRound = function() {
document.getElementById('playerCount').textContent = currentRound ? `· ${currentRound.players.length} players` : '';
const code = localStorage.getItem('ff_code');
if (!db || !code || !currentRound) return;
clearTimeout(pushTimer);
pushTimer = setTimeout(async () => {
syncing = true;
try {
await setDoc(doc(db, 'rounds', code), JSON.parse(JSON.stringify(currentRound)));
setSync(true);
} catch (e) { setSync(false); }
syncing = false;
}, 400);
};
function listen() {
const code = localStorage.getItem('ff_code');
if (!db || !code || unsub) return;
unsub = onSnapshot(doc(db, 'rounds', code), (snap) => {
if (syncing || !snap.exists() || !currentRound) return;
const cloud = snap.data();
if (cloud.course && cloud.course.name === currentRound.course.name) {
currentRound = cloud;
localStorage.setItem('ff_round', JSON.stringify(currentRound));
renderScorecard(); renderLeaderboard();
}
}, () => setSync(false));
}
function setSync(on) {
document.getElementById('syncDot').className = 'syncDot' + (on ? ' on' : '');
}
const savedCode = localStorage.getItem('ff_code');
if (savedCode) {
document.getElementById('codeBar').style.display = 'block';
document.getElementById('codeLabel').textContent = savedCode;
listen();
}
</script>
</body>
</html>
